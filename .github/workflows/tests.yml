name: Tester

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loppis_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: loppis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loppis_test -d loppis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://loppis_test:ci-only-password@127.0.0.1:5432/loppis_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: SQLite-regressioner och PostgreSQL 10 x 100
        run: pytest -q
