<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal – Loppiskassan</title><style>body{font:16px system-ui;max-width:800px;margin:35px auto;padding:15px}input,select,button{padding:10px;margin:5px}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ddd}</style><h1>Personal och behörigheter</h1><p>Administratör: skapa separata konton. Kassapersonal får registrera köp men inte ändra provision eller avsluta loppis.</p><form id="f"><input name="username" placeholder="Användarnamn" required pattern="[a-zA-Z0-9_.-]+"><input name="password" type="password" placeholder="Lösenord (minst 12 tecken)" required minlength="12"><select name="role"><option value="cashier">Kassapersonal</option><option value="admin">Administratör</option></select><button>Skapa konto</button></form><p id="msg"></p><table><thead><tr><th>Användare</th><th>Roll</th><th>Aktiv</th><th>Åtgärd</th></tr></thead><tbody id="rows"></tbody></table><p><a href="/admin">Till administrationen</a></p><script>async function load(){let r=await fetch('/api/staff');if(!r.ok)return;let d=await r.json();rows.replaceChildren();for(let x of d.staff){let tr=document.createElement('tr');for(let v of [x.username,x.role,x.active?'Ja':'Nej']){let td=document.createElement('td');td.textContent=v;tr.append(td)}let td=document.createElement('td');let b=document.createElement('button');b.textContent='Spärra';b.disabled=!x.active;b.onclick=async()=>{let r=await fetch('/api/staff/'+encodeURIComponent(x.username)+'/disable',{method:'POST'});msg.textContent=r.ok?'Kontot spärrat':await r.text();load()};td.append(b);tr.append(td);rows.append(tr)}}f.onsubmit=async e=>{e.preventDefault();let v=Object.fromEntries(new FormData(f));let r=await fetch('/api/staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(v)});msg.textContent=r.ok?'Kontot skapat':await r.text();if(r.ok)f.reset();load()};load()</script></html>
