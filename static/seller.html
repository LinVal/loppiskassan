<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Min försäljning – Loppiskassan</title><style>body{font:16px system-ui;background:#f5f6fa;color:#172339;margin:0}header{background:#162c49;color:white;padding:20px}main{max-width:900px;margin:auto;padding:20px}.card{background:white;border-radius:12px;padding:20px;margin:15px 0}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #ddd;padding:10px;text-align:left}.scroll{overflow:auto}</style><link rel="stylesheet" href="/static/design-system.css"><header><b>◈ Loppiskassan – Min försäljning</b></header><main><section class="card"><h1 id="name">Laddar…</h1><div class="seller-summary"><span>Registrerad försäljning efter korrigeringar</span><strong id="total" aria-live="polite">–</strong></div><p>Beloppen visar registrerad försäljning efter korrigeringar. Detta är inte en utbetalningsbekräftelse. Eventuell provision och slutlig utbetalning redovisas separat.</p><div class="scroll"><table><thead><tr><th>Datum</th><th>Beskrivning</th><th>Försäljning</th><th>Korrigering</th><th>Netto</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{try{let token=new URLSearchParams(location.search).get('token');if(!token)throw Error('Saknar giltig länk');let r=await fetch('/api/portal/'+encodeURIComponent(token),{cache:'no-store'});if(!r.ok)throw Error('Länken är ogiltig eller har återkallats');let d=await r.json();document.getElementById('name').textContent='Säljare '+d.seller.number+' – '+d.seller.name;document.getElementById('total').textContent=new Intl.NumberFormat('sv-SE').format(d.total)+' kr';document.getElementById('rows').innerHTML=d.items.map(i=>`<tr><td>${esc(i.created_at.slice(0,16))}</td><td>${esc(i.description)}</td><td>${i.price} kr</td><td>${i.correction} kr</td><td>${i.price+i.correction} kr</td></tr>`).join('')||'<tr><td colspan="5">Inga sålda varor ännu</td></tr>'}catch(e){document.getElementById('name').textContent=e.message;document.getElementById('total').textContent='–'}})();
</script></html>
