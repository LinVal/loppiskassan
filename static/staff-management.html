<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal</title><style>body{font:16px system-ui;background:#f8f5f8;color:#243046;margin:0;padding:25px}main{max-width:1050px;margin:auto}section{background:white;border:1px solid #e4d8e2;border-radius:14px;padding:22px;margin:16px 0}input,select,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #c9b9c8}button{background:#245b99;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eee;padding:10px}.error{color:#a11935}small{color:#666}</style><main><h1>Personal & kassor</h1><section><h2>Personalkonton</h2><button id="refresh">Uppdatera konton</button><div id="users"></div></section><section><h2>Skapa konto</h2><form id="form"><label>Användarnamn <input id="username" required minlength="2"></label><label>Lösenord <input id="password" type="password" required minlength="12"></label><label>Roll <select id="role"><option value="cashier">Kassapersonal</option><option value="admin">Administratör</option></select></label><button>Skapa konto</button></form><p id="message" role="status"></p></section><p><small>Rollväljaren i vänstermenyn är fortfarande ett demonstrationsfilter. API:erna kontrollerar kontots verkliga roll.</small></p></main><script>
const $=id=>document.getElementById(id);async function req(path,options){const r=await fetch(path,options);if(!r.ok)throw Error('HTTP '+r.status);return r.json()};$('refresh').onclick=async()=>{try{const d=await req('/api/staff');const area=$('users');area.replaceChildren();for(const u of d.staff){const line=document.createElement('p');line.textContent=u.username+' · '+u.role+' · '+(u.active?'Aktiv':'Spärrad');if(u.active){const btn=document.createElement('button');btn.textContent='Spärra';btn.onclick=async()=>{if(!confirm('Spärra '+u.username+'?'))return;try{await req('/api/staff/'+encodeURIComponent(u.username)+'/disable',{method:'POST'});$('refresh').click()}catch(e){alert(e.message)}};line.append(btn)}area.append(line)}}catch(e){$('users').textContent='Kunde inte hämta konton: '+e.message}};$('form').onsubmit=async e=>{e.preventDefault();try{await req('/api/staff',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value,role:$('role').value})});$('message').textContent='Kontot har skapats.';$('password').value='';$('refresh').click()}catch(e){$('message').textContent='Kunde inte skapa kontot: '+e.message}};$('refresh').click();
</script></html>
