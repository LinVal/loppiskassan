<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loppiskassan · mobilkamera</title><style>body{font:17px system-ui;background:#f2f5f9;color:#142338;max-width:600px;margin:35px auto;padding:20px}.card{background:white;padding:24px;border-radius:16px;box-shadow:0 5px 25px #ccd6e2}button{background:#1264d6;color:white;border:0;padding:15px;border-radius:9px;font-size:17px;font-weight:700;width:100%;margin-top:16px}input{max-width:100%}small{color:#65788c}</style><div class="card"><h1>📸 Mobilkamera</h1><p>Fotografera en prislapp i taget eller ett helt A4-ark. Alla bilder hamnar i samma pågående köp.</p><input id="file" type="file" accept="image/*" capture="environment"><button id="send">Skicka bild till kassan</button><p id="status" role="status"></p><small>Länken gäller i fem minuter och kan användas för flera bilder under samma köp. Inga betalningar hanteras här.</small></div><script>const token=new URLSearchParams(location.search).get('token');document.getElementById('send').onclick=async()=>{let f=document.getElementById('file').files[0];if(!token||!f)return alert('Välj en bild och öppna en giltig kassalänk.');let form=new FormData();form.append('photo',f);let status=document.getElementById('status');status.textContent='Skickar…';try{let r=await fetch('/api/mobile/'+encodeURIComponent(token)+'/photo',{method:'POST',body:form});let data=await r.json();if(!r.ok)throw Error(data.detail||'Misslyckades');status.textContent='✓ Bilden är skickad! Ta nästa lapp eller återgå till kassan.';document.getElementById('file').value=''}catch(e){status.textContent='Fel: '+e.message}}</script></html>
