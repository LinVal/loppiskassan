<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loppiskassan · Administration</title><link rel="stylesheet" href="/static/design-system.css"><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#1c2b3f;font:16px system-ui,-apple-system,sans-serif}.layout{display:grid;grid-template-columns:258px minmax(0,1fr);min-height:100vh}.sidebar{background:#172c49;color:white;padding:24px 14px;display:flex;flex-direction:column;gap:4px}.brand{font-weight:750;font-size:20px;margin:0 10px 24px}.nav{display:block;color:#e1e9f4;text-decoration:none;border-radius:9px;padding:11px 14px}.nav:hover,.nav[aria-current=page]{background:#355276;color:white}.spacer{flex:1}.main{min-width:0;padding:30px;max-width:1500px;width:100%;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.top h1{font-size:28px;margin:0}.desc{color:#5d6a7a;margin:7px 0 0}.content{background:white;border-radius:14px;padding:20px;min-height:60vh;border:1px solid #e1e6ed}.frame{width:100%;border:0;min-height:850px;display:block}.tile{padding:20px;border:1px solid #e0e6ee;border-radius:12px;background:#fff;text-decoration:none;color:#17334f}.tile:hover{background:#f3f7fc}.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.tile strong{display:block;margin-bottom:8px}.tile small{color:#5c6b7d}.rolebox{padding:12px 10px;margin:0 0 18px;border:1px solid #49617f;border-radius:12px}.rolebox label{display:block;color:#d5e2f2;font-size:13px;margin-bottom:8px}.rolebox select{width:100%;padding:10px;border:1px solid #8fa3bc;border-radius:8px;background:#fff;color:#17334f}.rolehint{font-size:12px;color:#d0dbea;margin:8px 0 0}.mobile-menu{display:none}@media(max-width:760px){.layout{display:block}.sidebar{padding:12px;display:block}.brand{margin:0 0 10px}.sidebar nav{display:flex;overflow-x:auto;gap:5px}.nav{white-space:nowrap}.spacer{display:none}.main{padding:14px}.top h1{font-size:23px}.content{padding:10px}.frame{min-height:1000px}}
</style></head><body><div class="layout"><aside class="sidebar"><div class="brand">◈ Loppiskassan</div><div class="rolebox"><label for="roleSelector">Visningsläge (demo)</label><select id="roleSelector"><option value="admin">Administratör</option><option value="cashier">Kassapersonal</option></select><p class="rolehint">Påverkar endast menyn – inte inloggning eller behörigheter.</p></div><nav id="nav" aria-label="Huvudmeny"></nav><div class="spacer"></div><span class="rolehint" style="padding:12px">Behörigheter kontrolleras fortsatt av servern.</span></aside><main class="main"><header class="top"><div><h1 id="title">Administration</h1><p class="desc" id="description">Hantera loppisens alla funktioner</p></div></header><div class="content" id="content" aria-live="polite"></div></main></div><script>
const views=[["cashier", "Kassan", "Registrera varor och ta betalt", "/"], ["overview", "Översikt", "Samlad ingång för administrationen", ""], ["events", "Loppistillfällen", "Skapa, starta och avsluta loppisar", "/events/module?view=events"], ["assignments", "Säljartilldelning", "Import, startkontroll och återkommande säljare", "/events/module?view=assignments"], ["sellers", "Säljarregister", "Sök och hantera säljare", "/admin/module?view=sellers"], ["sales", "Försäljningar", "Köphistorik och rättelser", "/admin/module?view=sales"], ["rates", "Provision", "Individuella provisionssatser", "/events/module?view=rates"], ["settlement", "Slutavräkning", "Utbetalningar och export", "/events/module?view=settlement"], ["reports", "Rapporter", "Försäljning per säljare, kassa och dag", "/admin/module?view=reports"], ["audit", "Korrigeringslogg", "Spårbarhet för manuella rättelser", "/admin/module?view=audit"]];const nav=document.getElementById('nav'),content=document.getElementById('content');
const roleSelector=document.getElementById('roleSelector');
let role=localStorage.getItem('loppiskassan_demo_role')==='cashier'?'cashier':'admin';
roleSelector.value=role;
function allowedViews(){return role==='cashier'?views.filter(v=>v[0]==='cashier'):views;}
roleSelector.addEventListener('change',()=>{role=roleSelector.value;localStorage.setItem('loppiskassan_demo_role',role);location.hash=role==='cashier'?'cashier':'overview';render();});
function render(){let available=allowedViews();let key=decodeURIComponent(location.hash.slice(1))||(role==='cashier'?'cashier':'overview');let entry=available.find(x=>x[0]===key)||available[0];nav.replaceChildren();for(const item of available){const a=document.createElement('a');a.href='#'+item[0];a.className='nav';a.textContent=item[1];if(item[0]===entry[0])a.setAttribute('aria-current','page');nav.append(a)}document.getElementById('title').textContent=entry[1];document.getElementById('description').textContent=entry[2];content.replaceChildren();if(!entry[3]){let tiles=document.createElement('div');tiles.className='tiles';for(const item of available.filter(x=>x[0]!=='overview')){let a=document.createElement('a');a.className='tile';a.href='#'+item[0];let strong=document.createElement('strong'),small=document.createElement('small');strong.textContent=item[1];small.textContent=item[2];a.append(strong,small);tiles.append(a)}content.append(tiles)}else{let iframe=document.createElement('iframe');iframe.className='frame';iframe.title=entry[1];iframe.src=entry[3];if(entry[0]==='cashier'){iframe.style.minHeight='1100px';}iframe.addEventListener('load',()=>{try{const h=iframe.contentDocument.documentElement.scrollHeight;iframe.style.height=Math.max(650,h+35)+'px'}catch(e){}});content.append(iframe)}}window.addEventListener('hashchange',render);render();
</script></body></html>
