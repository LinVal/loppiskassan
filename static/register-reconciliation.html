<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kassaavstämning</title><style>body{font:16px system-ui;background:#f8f5f8;color:#243046;margin:0;padding:25px}main{max-width:1050px;margin:auto}section{background:white;border:1px solid #e4d8e2;border-radius:14px;padding:22px;margin:16px 0}input,select,button{padding:10px;margin:5px;border-radius:8px;border:1px solid #c9b9c8}button{background:#245b99;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #eee;padding:10px}.error{color:#a11935}small{color:#666}</style><main><h1>Betalningar · Kassaavstämning</h1><p>Manuell avstämning mot kassapersonalens uppgifter. Inga automatiska bank- eller kortkontroller görs.</p><section><label>Loppistillfällets ID <input id="event" size="38" placeholder="Klistra in evenemangs-ID"></label><button id="load">Hämta</button><div id="result" aria-live="polite"></div></section><section><h2>Registrera avstämning</h2><form id="form"><label>Kassa <input id="register" required maxlength="16"></label><label>Betalsätt <select id="method"><option>Swish</option><option>Kort</option><option>Kontant</option></select></label><label>Räknat belopp (kr) <input id="counted" type="number" min="0" step="1" required></label><label>Anteckning <input id="note" maxlength="500"></label><button>Spara avstämning</button></form><p id="message" role="status"></p></section></main><script>
const $=id=>document.getElementById(id);async function request(path,options){const r=await fetch(path,options);if(!r.ok)throw Error('Servern svarade '+r.status);return r.json()}
$('load').onclick=async()=>{const target=$('result');target.textContent='Laddar…';try{const d=await request('/api/admin/register-reconciliation?event_id='+encodeURIComponent($('event').value));target.replaceChildren();const h=document.createElement('h3');h.textContent='Registrerad försäljning per kassa och betalsätt';target.append(h);const table=document.createElement('table');table.innerHTML='<thead><tr><th>Kassa</th><th>Metod</th><th>Köp</th><th>Förväntat</th></tr></thead>';const body=document.createElement('tbody');for(const row of d.expected){const tr=document.createElement('tr');for(const val of [row.register_no,row.method,row.sales_count,row.expected_amount+' kr']){const td=document.createElement('td');td.textContent=val;tr.append(td)}body.append(tr)}table.append(body);target.append(table);const hist=document.createElement('p');hist.textContent=d.reconciliations.length+' tidigare avstämningar. Senaste differens: '+(d.reconciliations[0]?.difference??'–')+' kr.';target.append(hist)}catch(e){target.textContent=e.message;target.className='error'}};
$('form').onsubmit=async e=>{e.preventDefault();$('message').textContent='Sparar…';try{const d=await request('/api/admin/register-reconciliation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({event_id:$('event').value,register_no:$('register').value,method:$('method').value,counted_amount:Number($('counted').value),note:$('note').value})});$('message').textContent='Sparat. Differens: '+d.difference+' kr.';$('load').click()}catch(e){$('message').textContent='Kunde inte spara: '+e.message}};
</script></html>
